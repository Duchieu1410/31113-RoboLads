<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a1c" />
      <stop offset="100%" stop-color="#07030a" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#compBg)" />

  <!-- FTC Arena Field Perimeter -->
  <rect x="75" y="45" width="350" height="190" rx="6" fill="#0d0818" stroke="#ff0055" stroke-width="2" opacity="0.7" />
  
  <!-- Alliance Stations (Red / Blue) -->
  <rect x="75" y="45" width="175" height="190" fill="#3a0ca3" opacity="0.25" />
  <rect x="250" y="45" width="175" height="190" fill="#f72585" opacity="0.25" />
  <line x1="250" y1="45" x2="250" y2="235" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Central Trophy -->
  <g transform="translate(250, 130)" stroke="#ffcc00" stroke-width="2" fill="none">
    <path d="M-22,-35 L22,-35 L18,5 L-18,5 Z" fill="#ffcc00" fill-opacity="0.2" />
    <path d="M-18,-25 C-32,-25 -32, -5 -16,-5" stroke="#ffcc00" stroke-width="2" />
    <path d="M18,-25 C32,-25 32, -5 16,-5" stroke="#ffcc00" stroke-width="2" />
    <rect x="-8" y="5" width="16" height="20" fill="#ffb800" />
    <rect x="-24" y="25" width="48" height="10" rx="3" fill="#ffb800" />
  </g>

  <text x="250" y="270" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="13" fill="#ff007f" letter-spacing="2">
    FTC TOURNAMENTS &amp; ARENA
  </text>
</svg>
