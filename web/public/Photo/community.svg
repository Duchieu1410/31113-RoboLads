<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="commBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1f38" />
      <stop offset="100%" stop-color="#050d18" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#commBg)" />

  <!-- Network / Outreach Nodes -->
  <g stroke="#ffcc00" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.5">
    <line x1="250" y1="120" x2="140" y2="80" />
    <line x1="250" y1="120" x2="360" y2="80" />
    <line x1="250" y1="120" x2="180" y2="200" />
    <line x1="250" y1="120" x2="320" y2="200" />
  </g>

  <!-- Central HSGS Node -->
  <circle cx="250" cy="120" r="34" fill="#1e3a6a" stroke="#ffcc00" stroke-width="3" />
  <circle cx="250" cy="120" r="14" fill="#ffb800" />

  <!-- Outreach Nodes (Schools / Tour) -->
  <circle cx="140" cy="80" r="18" fill="#112244" stroke="#60a5fa" stroke-width="2" />
  <circle cx="360" cy="80" r="18" fill="#112244" stroke="#60a5fa" stroke-width="2" />
  <circle cx="180" cy="200" r="18" fill="#112244" stroke="#60a5fa" stroke-width="2" />
  <circle cx="320" cy="200" r="18" fill="#112244" stroke="#60a5fa" stroke-width="2" />

  <text x="250" y="270" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="13" fill="#60a5fa" letter-spacing="2">
    STEM OUTREACH &amp; IGNITE TOUR
  </text>
</svg>
