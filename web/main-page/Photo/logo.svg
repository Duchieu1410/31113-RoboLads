<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="50%" stop-color="#FFCC00" />
      <stop offset="100%" stop-color="#E59400" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141938" />
      <stop offset="100%" stop-color="#080A1A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagon Shield Emblem -->
  <polygon points="35,6 60,20 60,50 35,64 10,50 10,20" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Robot Eyes / Visor in Crest -->
  <path d="M20,30 L50,30 L45,40 L25,40 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="35" cy="22" r="3" fill="#FFF275" />
  <rect x="23" y="44" width="24" height="3" rx="1.5" fill="#FFCC00" opacity="0.8" />
  
  <!-- Team Text -->
  <text x="74" y="32" font-family="'Press Start 2P', monospace, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" letter-spacing="2">
    ROBOLADS
  </text>
  <text x="75" y="52" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFCC00" letter-spacing="3">
    FTC #31113 • HSGS
  </text>
</svg>
