<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="cadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09182b" />
      <stop offset="100%" stop-color="#020914" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#cadBg)" />
  
  <!-- CAD Blueprint Grid -->
  <g stroke="#1a4066" stroke-width="0.8" opacity="0.6">
    <line x1="0" y1="50" x2="500" y2="50" /><line x1="0" y1="100" x2="500" y2="100" />
    <line x1="0" y1="150" x2="500" y2="150" /><line x1="0" y1="200" x2="500" y2="200" />
    <line x1="0" y1="250" x2="500" y2="250" /><line x1="100" y1="0" x2="100" y2="300" />
    <line x1="200" y1="0" x2="200" y2="300" /><line x1="300" y1="0" x2="300" y2="300" />
    <line x1="400" y1="0" x2="400" y2="300" />
  </g>

  <!-- 3D Robot CAD Wireframe Isometric Projection -->
  <g transform="translate(250, 140)" stroke="#ffcc00" stroke-width="2" fill="none">
    <!-- Chassis perimeter -->
    <polygon points="0,-60 120,-10 120,40 0,90 -120,40 -120,-10" stroke="#00f0ff" stroke-width="2.5" fill="#00f0ff" fill-opacity="0.08" />
    <!-- Center gear -->
    <circle cx="0" cy="15" r="32" stroke="#ffcc00" stroke-width="2" stroke-dasharray="8 4" />
    <circle cx="0" cy="15" r="12" fill="#ffcc00" />
    <!-- Mechanism arm wireframe -->
    <line x1="0" y1="15" x2="40" y2="-75" stroke="#ffb800" stroke-width="3" />
    <circle cx="40" cy="-75" r="8" fill="#00f0ff" />
    <!-- Dimension arrows -->
    <path d="M-135,-10 L-135,40" stroke="#ff3b30" stroke-width="1.5" />
    <path d="M-140,-5 L-135,-10 L-130,-5" stroke="#ff3b30" stroke-width="1.5" />
    <path d="M-140,35 L-135,40 L-130,35" stroke="#ff3b30" stroke-width="1.5" />
  </g>

  <text x="250" y="270" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="13" fill="#00f0ff" letter-spacing="2">
    CAD &amp; FABRICATION LAB
  </text>
</svg>
